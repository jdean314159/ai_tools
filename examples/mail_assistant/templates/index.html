<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Mail Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <h1>Local Mail Assistant</h1>
    <nav><a href="/?view=unread&window_value={{ window_value }}&window_unit={{ window_unit }}">Unread</a> <a href="/?view=all&window_value={{ window_value }}&window_unit={{ window_unit }}">All</a></nav>
    <form method="get" action="/">
      <input type="hidden" name="view" value="{{ view }}">
      <label>Show last <input type="number" name="window_value" min="1" max="3650" value="{{ window_value }}" required></label>
      <select name="window_unit"><option value="days"{% if window_unit == 'days' %} selected{% endif %}>days</option><option value="weeks"{% if window_unit == 'weeks' %} selected{% endif %}>weeks</option></select>
      <button type="submit">Apply window</button>
    </form>
    <form method="post" action="/refresh">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="view" value="{{ view }}">
      <input type="hidden" name="window_value" value="{{ window_value }}">
      <input type="hidden" name="window_unit" value="{{ window_unit }}">
      <button type="submit">Refresh snapshot</button>
    </form>
  </header>
  {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
  <main id="mail-list">{% include "mail_list.html" %}</main>
</body>
</html>
