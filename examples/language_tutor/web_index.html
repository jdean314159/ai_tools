<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Tutor</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --line: #d8dee8;
      --text: #1d2430;
      --muted: #667085;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --good: #0f766e;
      --bad: #b42318;
      --warn: #b54708;
      --soft: #eef4ff;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: #aeb8c8; }
    button.primary { background: var(--brand); border-color: var(--brand); color: white; }
    button.primary:hover { background: var(--brand-dark); }
    button.danger { background: #fff1f0; border-color: #fecdca; color: var(--bad); }
    button.icon { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--text);
      padding: 8px 10px;
      min-width: 0;
    }
    textarea { resize: vertical; width: 100%; min-height: 72px; }
    .hidden { display: none !important; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: var(--brand);
      color: white;
      font-weight: 800;
    }
    .status { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 340px;
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .sidebar, .tools { padding: 14px; align-self: start; }
    .section-title {
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      font-size: 12px;
    }
    .field { display: grid; gap: 5px; margin-bottom: 10px; }
    .field label { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stack { display: grid; gap: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      background: #fbfcfe;
    }
    .stat strong { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 11px; }
    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: calc(100vh - 94px);
      overflow: hidden;
    }
    .plan {
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      background: #fbfcfe;
    }
    .plan h2 { margin: 0 0 4px; font-size: 15px; }
    .plan p { margin: 0; color: var(--muted); }
    .messages {
      overflow: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 240px;
    }
    .message {
      max-width: 82%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.user { align-self: flex-end; background: var(--soft); border-color: #c7d7fe; }
    .message.tutor { align-self: flex-start; background: white; }
    .meta-line { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .composer {
      border-top: 1px solid var(--line);
      padding: 12px;
      background: var(--panel);
      display: grid;
      gap: 8px;
    }
    .feedback-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      background: #fbfcfe;
    }
    .feedback-card.good { border-color: #99f6e4; background: #f0fdfa; }
    .feedback-card.bad { border-color: #fecaca; background: #fff7f7; }
    .scroll { max-height: 280px; overflow: auto; display: grid; gap: 8px; }
    .drill-question { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fbfcfe; }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 2px 8px;
      color: var(--muted);
      font-size: 12px;
      background: white;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      display: grid;
      place-items: center;
      z-index: 20;
      padding: 16px;
    }
    .modal {
      width: min(620px, 100%);
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .modal h2 { margin: 0 0 8px; }
    .lookup-menu {
      position: fixed;
      z-index: 30;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .lookup-menu button {
      border: 0;
      border-radius: 0;
      width: 100%;
      text-align: left;
      background: white;
      white-space: nowrap;
    }
    .lookup-menu button:hover { background: var(--bg); }
    .lookup-popup {
      position: fixed;
      z-index: 30;
      width: min(320px, calc(100vw - 24px));
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .lookup-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .lookup-word { color: var(--brand); font-weight: 700; overflow-wrap: anywhere; }
    .lookup-close { border: 0; padding: 2px 6px; background: transparent; color: var(--muted); }
    .lookup-body { line-height: 1.55; }
    .lookup-translation { font-weight: 700; margin-bottom: 4px; }
    .lookup-alts, .lookup-notes { color: var(--muted); margin-bottom: 4px; }
    .lookup-pos { display: inline-block; background: var(--soft); color: var(--brand-dark); border-radius: 999px; padding: 1px 8px; font-size: 12px; margin-bottom: 6px; }
    .lookup-example { background: #fbfcfe; border-left: 3px solid var(--brand); border-radius: 6px; padding: 6px 8px; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .chat { min-height: 70vh; }
      .message { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">LT</span><span>Language Tutor</span></div>
      <div class="status" id="status">Choose a language and start a session.</div>
    </header>

    <main class="layout">
      <aside class="panel sidebar">
        <h2 class="section-title">Session</h2>
        <div class="field">
          <label for="language">Language</label>
          <select id="language">
            <option value="spanish">Spanish</option>
            <option value="latin">Latin</option>
          </select>
        </div>
        <div class="field">
          <label for="backend">Backend</label>
          <select id="backend">
            <option value="ollama">Ollama</option>
            <option value="stub">Offline stub</option>
          </select>
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input id="model" value="qwen3:8b">
        </div>
        <div class="field">
          <label for="duration">Minutes</label>
          <input id="duration" type="number" min="5" max="120" step="5" value="30">
        </div>
        <div class="row">
          <button class="primary" id="startBtn">Start</button>
          <button class="danger" id="endBtn" disabled>End</button>
        </div>
        <div class="stats">
          <div class="stat"><strong id="statTurns">0</strong><span>Turns</span></div>
          <div class="stat"><strong id="statCorrections">0</strong><span>Corrections</span></div>
          <div class="stat"><strong id="statVocab">0</strong><span>Vocab</span></div>
        </div>
        <hr>
        <div class="stack">
          <button id="historyBtn">Recent Sessions</button>
          <button id="memoryBtn" disabled>Memory Snapshot</button>
        </div>
      </aside>

      <section class="panel chat">
        <div class="plan" id="planBox">
          <h2>No active lesson</h2>
          <p>Start a session to generate a plan.</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <div id="checkResults" class="hidden"></div>
          <textarea id="messageInput" placeholder="Type your message. Enter sends, Shift+Enter adds a newline." disabled></textarea>
          <div class="row">
            <button class="primary" id="sendBtn" disabled>Send</button>
            <button id="checkBtn" disabled>Check</button>
            <button id="explainBtn" disabled>Explain</button>
            <button id="lookupBtn" disabled>Lookup Word</button>
          </div>
        </div>
      </section>

      <aside class="panel tools">
        <h2 class="section-title">Drills</h2>
        <div class="field">
          <label for="drillType">Type</label>
          <select id="drillType"></select>
        </div>
        <div class="row">
          <button id="drillBtn" disabled>New Drill</button>
        </div>
        <div id="drillBox" class="stack"></div>
        <hr>
        <h2 class="section-title">Vocabulary Import</h2>
        <textarea id="importText" placeholder="Paste pairs separated by blank lines:&#10;aprender&#10;to learn"></textarea>
        <button id="importBtn" disabled>Import</button>
        <div id="feedback" class="scroll"></div>
      </aside>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="modalTitle">Details</h2>
      <div id="modalBody"></div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button id="modalClose">Close</button>
      </div>
    </div>
  </div>

  <div id="lookupMenu" class="lookup-menu hidden">
    <button id="lookupMenuBtn">Look up translation</button>
  </div>

  <div id="lookupPopup" class="lookup-popup hidden">
    <div class="lookup-header">
      <span id="lookupWord" class="lookup-word"></span>
      <button id="lookupClose" class="lookup-close" title="Close">x</button>
    </div>
    <div id="lookupBody" class="lookup-body"></div>
  </div>

  <script>
    let sessionId = null;
    let activeDrill = null;
    let lookupTarget = "";
    let lookupContext = "";

    const $ = (id) => document.getElementById(id);
    const status = (text) => { $("status").textContent = text; };
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || response.statusText);
      return data;
    }

    function setActive(active) {
      for (const id of ["messageInput", "sendBtn", "checkBtn", "explainBtn", "lookupBtn", "drillBtn", "importBtn", "memoryBtn", "endBtn"]) {
        $(id).disabled = !active;
      }
      $("startBtn").disabled = active;
    }

    function addMessage(role, text, meta = "") {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.innerHTML = `<div>${esc(text)}</div>${meta ? `<div class="meta-line">${esc(meta)}</div>` : ""}`;
      $("messages").appendChild(node);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function addFeedback(title, text, kind = "") {
      const node = document.createElement("div");
      node.className = `feedback-card ${kind}`;
      node.innerHTML = `<strong>${esc(title)}</strong><div>${esc(text)}</div>`;
      $("feedback").prepend(node);
    }

    function updateStats(metrics) {
      $("statTurns").textContent = metrics.exchanges || 0;
      $("statCorrections").textContent = metrics.corrections_made || 0;
      $("statVocab").textContent = metrics.vocab_learned || 0;
    }

    async function refreshMetrics() {
      if (!sessionId) return;
      updateStats(await api(`/api/session/metrics/${sessionId}`));
    }

    function showModal(title, html) {
      $("modalTitle").textContent = title;
      $("modalBody").innerHTML = html;
      $("modalBackdrop").classList.remove("hidden");
    }

    function renderLookup(data) {
      const alternatives = Array.isArray(data.alternatives) ? data.alternatives.filter(Boolean) : [];
      return `
        <div class="lookup-translation">${esc(data.translation || "")}</div>
        ${alternatives.length ? `<div class="lookup-alts">Also: ${esc(alternatives.join(", "))}</div>` : ""}
        ${data.part_of_speech ? `<span class="lookup-pos">${esc(data.part_of_speech)}</span>` : ""}
        ${data.notes ? `<div class="lookup-notes">${esc(data.notes)}</div>` : ""}
        ${data.example ? `<div class="lookup-example">${esc(data.example)}</div>` : ""}
      `;
    }

    function wordFromPoint(event) {
      const range = document.caretRangeFromPoint
        ? document.caretRangeFromPoint(event.clientX, event.clientY)
        : null;
      const node = range?.startContainer;
      if (!node || node.nodeType !== Node.TEXT_NODE) return "";
      const text = node.textContent || "";
      let start = range.startOffset;
      let end = range.startOffset;
      while (start > 0 && /[\p{L}\p{M}'-]/u.test(text[start - 1])) start -= 1;
      while (end < text.length && /[\p{L}\p{M}'-]/u.test(text[end])) end += 1;
      return text.slice(start, end).trim();
    }

    function selectionContext() {
      const selection = window.getSelection();
      return (selection?.anchorNode?.textContent || "").slice(0, 300);
    }

    function openLookupMenu(event) {
      if (!sessionId) return;
      const selected = window.getSelection().toString().trim();
      const word = selected || wordFromPoint(event);
      if (!word) return;
      event.preventDefault();
      lookupTarget = word.slice(0, 80);
      lookupContext = selectionContext();
      $("lookupMenu").style.left = `${Math.min(event.clientX, window.innerWidth - 190)}px`;
      $("lookupMenu").style.top = `${Math.min(event.clientY, window.innerHeight - 52)}px`;
      $("lookupMenu").classList.remove("hidden");
      $("lookupPopup").classList.add("hidden");
    }

    async function showLookup(word, context) {
      $("lookupWord").textContent = word;
      $("lookupBody").textContent = "Looking up...";
      $("lookupPopup").style.left = `${Math.min(window.innerWidth - 332, Math.max(12, window.innerWidth * 0.58))}px`;
      $("lookupPopup").style.top = "92px";
      $("lookupPopup").classList.remove("hidden");
      try {
        const data = await api("/api/conversation/lookup", {
          method: "POST",
          body: JSON.stringify({ session_id: sessionId, word, context: context || null }),
        });
        $("lookupBody").innerHTML = renderLookup(data);
      } catch (err) {
        $("lookupBody").innerHTML = `<div class="feedback-card bad">${esc(err.message)}</div>`;
      }
    }

    async function loadDrillTypes() {
      const language = $("language").value;
      const data = await api(`/api/conversation/drill/types?language=${encodeURIComponent(language)}`);
      $("drillType").innerHTML = data.types.map((item) => `<option value="${esc(item.id)}">${esc(item.label)}</option>`).join("");
    }

    $("language").addEventListener("change", loadDrillTypes);
    $("modalClose").addEventListener("click", () => $("modalBackdrop").classList.add("hidden"));
    $("messages").addEventListener("contextmenu", openLookupMenu);
    $("messageInput").addEventListener("contextmenu", openLookupMenu);
    $("lookupMenuBtn").addEventListener("click", () => {
      $("lookupMenu").classList.add("hidden");
      showLookup(lookupTarget, lookupContext);
    });
    $("lookupClose").addEventListener("click", () => $("lookupPopup").classList.add("hidden"));
    document.addEventListener("click", (event) => {
      if (!$("lookupMenu").contains(event.target)) $("lookupMenu").classList.add("hidden");
    });

    $("startBtn").addEventListener("click", async () => {
      try {
        status("Starting session...");
        const data = await api("/api/session/start", {
          method: "POST",
          body: JSON.stringify({
            language: $("language").value,
            backend: $("backend").value,
            model: $("model").value,
            duration_minutes: Number($("duration").value || 30),
          }),
        });
        sessionId = data.session_id;
        setActive(true);
        $("messages").innerHTML = "";
        $("feedback").innerHTML = "";
        const focus = Array.isArray(data.plan.focus_areas) ? data.plan.focus_areas.join(", ") : "General conversation";
        $("planBox").innerHTML = `<h2>${esc(data.plan.warmup_topic || "Lesson plan")}</h2><p>${esc(focus)}</p>`;
        addMessage("tutor", data.greeting, `${data.backend}/${data.model}`);
        status(`Session ${sessionId} is active.`);
        await refreshMetrics();
      } catch (err) {
        status(`Start failed: ${err.message}`);
      }
    });

    $("sendBtn").addEventListener("click", sendMessage);
    $("messageInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function sendMessage() {
      const text = $("messageInput").value.trim();
      if (!text || !sessionId) return;
      $("messageInput").value = "";
      addMessage("user", text);
      try {
        status("Generating response...");
        const data = await api("/api/conversation/message", {
          method: "POST",
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        addMessage("tutor", data.text, `memory tokens: ${data.metadata?.memory_tokens || 0}`);
        for (const item of data.corrections || []) addFeedback("Correction", `${item.error} -> ${item.correction}`, "bad");
        for (const item of data.new_vocabulary || []) addFeedback("Vocabulary", `${item.word}: ${item.translation}`, "good");
        await refreshMetrics();
        status("Ready.");
      } catch (err) {
        status(`Message failed: ${err.message}`);
      }
    }

    $("checkBtn").addEventListener("click", async () => {
      const text = $("messageInput").value.trim();
      if (!text) return;
      const data = await api("/api/conversation/check", { method: "POST", body: JSON.stringify({ session_id: sessionId, text }) });
      $("checkResults").classList.remove("hidden");
      $("checkResults").innerHTML = data.errors.length
        ? data.errors.map((item) => `<div class="feedback-card bad"><strong>${esc(item.type || "Issue")}</strong><div>${esc(item.error)} -> ${esc(item.suggestion)} ${esc(item.hint || "")}</div></div>`).join("")
        : `<div class="feedback-card good">No issues found.</div>`;
    });

    $("explainBtn").addEventListener("click", async () => {
      const text = $("messageInput").value.trim() || prompt("Text to explain:");
      if (!text) return;
      const data = await api("/api/conversation/explain", { method: "POST", body: JSON.stringify({ session_id: sessionId, text }) });
      showModal("Explanation", `<p>${esc(data.explanation)}</p>`);
    });

    $("lookupBtn").addEventListener("click", async () => {
      const word = prompt("Word or phrase to look up:");
      if (!word) return;
      const data = await api("/api/conversation/lookup", { method: "POST", body: JSON.stringify({ session_id: sessionId, word }) });
      showModal(`Lookup: ${word}`, renderLookup(data));
    });

    $("drillBtn").addEventListener("click", async () => {
      const data = await api("/api/conversation/drill", { method: "POST", body: JSON.stringify({ session_id: sessionId, drill_type: $("drillType").value }) });
      activeDrill = data;
      $("drillBox").innerHTML = `
        <div class="drill-question">
          <span class="pill">${esc(data.drill_type)}</span>
          <h3>${esc(data.prompt)}</h3>
          <p>${esc(data.context || "")}</p>
          <input id="drillAnswer" placeholder="Your answer">
          <button class="primary" id="drillSubmit">Check</button>
          <p class="meta-line">${esc(data.hint || "")}</p>
        </div>`;
      $("drillSubmit").addEventListener("click", submitDrill);
    });

    async function submitDrill() {
      const answer = $("drillAnswer").value.trim();
      const result = await api("/api/conversation/drill/check", { method: "POST", body: JSON.stringify({ session_id: sessionId, answer }) });
      addFeedback(result.correct ? "Drill Correct" : "Drill Review", result.feedback, result.correct ? "good" : "bad");
      $("drillBox").innerHTML += `<div class="feedback-card ${result.correct ? "good" : "bad"}">Correct answer: ${esc(result.correct_answer)}</div>`;
      await refreshMetrics();
    }

    $("importBtn").addEventListener("click", async () => {
      const text = $("importText").value.trim();
      if (!text) return;
      const result = await api("/api/conversation/import/vocabulary", { method: "POST", body: JSON.stringify({ session_id: sessionId, text }) });
      addFeedback("Vocabulary import", `${result.imported} imported, ${result.skipped} skipped`, "good");
    });

    $("memoryBtn").addEventListener("click", async () => {
      const data = await api(`/api/session/memory/${sessionId}`);
      showModal("Memory Snapshot", `<pre>${esc(JSON.stringify(data, null, 2))}</pre>`);
    });

    $("historyBtn").addEventListener("click", async () => {
      const language = $("language").value;
      const data = await api(`/api/session/history/${encodeURIComponent(language)}`);
      showModal("Recent Sessions", `<pre>${esc(JSON.stringify(data, null, 2))}</pre>`);
    });

    $("endBtn").addEventListener("click", async () => {
      if (!sessionId) return;
      const done = await api("/api/session/end", { method: "POST", body: JSON.stringify({ session_id: sessionId, message: "" }) });
      showModal("Session Complete", `<pre>${esc(JSON.stringify(done, null, 2))}</pre>`);
      sessionId = null;
      setActive(false);
      status("Session ended.");
    });

    loadDrillTypes().catch((err) => status(err.message));
  </script>
</body>
</html>
