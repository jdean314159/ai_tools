[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-tutor-example"
version = "0.1.0"
description = "Public-API language tutor example for the ai_tools LLM libraries."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2",
  "engram",
  "llm-engines",
  "llm-harness-core>=0.1.0",
]

[project.optional-dependencies]
web = [
  "fastapi",
  "uvicorn",
]
dev = [
  "language-tutor-example[web]",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
language-tutor-example = "examples.language_tutor.run_demo:main"
language-tutor-example-web = "examples.language_tutor.web_app:main"

[tool.setuptools]
include-package-data = true
packages = ["examples.language_tutor"]

[tool.setuptools.package-dir]
"examples.language_tutor" = "."

[tool.setuptools.package-data]
"examples.language_tutor" = ["web_index.html"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
