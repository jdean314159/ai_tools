# ingestion_patterns.yaml — configurable pattern sets for IngestionPolicy
#
# All regex patterns are compiled with re.IGNORECASE automatically.
# Edit this file to add languages, tune thresholds, or extend pattern lists
# without touching Python code.
#
# project_types keys must be substrings of ProjectType.value (lowercase).
# extra_* fields are appended to the corresponding default lists.

default:
  episode_threshold: 0.35
  max_episode_chars: 1200
  dedup_search_n: 3

  # Patterns that mark a turn as ephemeral (do not store in long-term memory).
  ephemeral_patterns:
    - '\bignore this\b'
    - '\bdo not remember\b'
    - '\bfor this message only\b'
    - '\btemporary note\b'
    - '^\s*transient note\s*:'
    - '\bonly asking about\b.*\bmistaken\b'
    - '\bnot for long[- ]term memory\b'
    - '\bephemeral\b'
    - '\bmensaje temporal\b'       # es: "temporary message"
    - '\bno recuerdes esto\b'      # es: "don't remember this"

  # Patterns that indicate a user preference worth storing semantically.
  preference_patterns:
    - '\bI prefer\s+(?P<value>.+)'
    - '\bI like\s+(?P<value>.+)'
    - "\bI (?:do not|don't) like\\s+(?P<value>.+)"
    - '\bmy favorite\s+(?P<category>\w+)\s+is\s+(?P<value>.+)'
    - '\bprefiero\s+(?P<value>.+)'  # es: "I prefer"
    - '\bme gusta\s+(?P<value>.+)' # es: "I like"

  # Patterns that indicate a factual statement worth storing semantically.
  fact_patterns:
    - '\bI am\s+(?P<value>.+)'
    - '\bI work on\s+(?P<value>.+)'
    - '\bI use\s+(?P<value>.+)'
    - '\bwe decided to\s+(?P<value>.+)'
    - '\bthe plan is to\s+(?P<value>.+)'
    - '\bestoy\s+(?P<value>.+)'     # es: "I am"
    - '\buso\s+(?P<value>.+)'       # es: "I use"
    - '\bdecidimos\s+(?P<value>.+)' # es: "we decided"

  # Keyword hints for episode importance scoring.
  user_profile_terms:
    - prefer
    - favorite
    - i like
    - i don't like
    - i am
    - i use
    - i work on
    - prefiero
    - me gusta
    - uso
    - trabajo en

  task_state_terms:
    - decided
    - plan
    - implemented
    - fixed
    - bug
    - issue
    - todo
    - next step
    - resolved
    - decision
    - milestone
    - deadline
    - decidimos
    - error

# Project-type-specific overrides.
# Only fields that differ from default are required.
# extra_* lists are appended to the corresponding default lists.
project_types:
  language_tutor:
    episode_threshold: 0.56
    extra_user_profile_terms:
      - studying
      - learning
      - practicing
      - aprendo    # es: "I learn"
      - practico   # es: "I practice"
    extra_task_state_terms:
      - mistake
      - grammar
      - vocabulary
      - pronunciation
      - gramática
      - vocabulario

  programming:
    episode_threshold: 0.6
    max_episode_chars: 1400
    dedup_search_n: 4
    extra_user_profile_terms:
      - stack
      - framework
      - language
      - tooling
    extra_task_state_terms:
      - stacktrace
      - incident
      - deploy
      - regression
      - refactor
      - asyncio
