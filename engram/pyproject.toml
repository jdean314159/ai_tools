[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.2.0"
description = "Production memory system for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "llm-harness-core>=0.1.0",
    "chromadb>=0.4.0",
    "numpy>=1.24",
    "requests>=2.31.0",
]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
tiktoken = ["tiktoken>=0.5.0"]
sentence-transformers = ["sentence-transformers>=2.2.0"]
neural-accel = ["torch>=2.0"]  # Optional GPU/torch backend; numpy is the default.
all = ["networkx>=3.0", "tiktoken>=0.5.0", "sentence-transformers>=2.2.0"]
dev = ["pytest>=8.0", "networkx>=3.0"]

[project.scripts]
engram-migrate = "engram.cli.migrate:main"
engram-reconcile = "engram.cli.reconcile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
