[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.1.19"
description = "Local-first memory runtime for LLM applications with layered memory and a sandbox reference app"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeffrey Dean"}]
readme = "README.md"

dependencies = [
    "pydantic>=2.0.0",
    "llm-harness-core>=0.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
]


[project.scripts]
engram = "engram.cli:main"

[project.optional-dependencies]
# Neural memory / RTRL (optional; keeps base install lightweight)
neural = [
    "torch>=2.0.0",
]
# Engine backends
engines = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.5.0",
    "json-repair>=0.7.0",
]
# Episodic memory (ChromaDB + embeddings)
episodic = [
    "chromadb>=0.4.22",
    "diskcache>=5.6.2",
]

local-embeddings = [
    "sentence-transformers>=2.2.0",
]

# Semantic memory (Kuzu graph DB)
semantic = [
    "kuzu>=0.4.0",
]
# TF-IDF extraction (entity extraction from text)
extraction = [
    "scikit-learn>=1.3.0",
]

# Note: Streamlit sandbox UI is now the separate engram-ui package.

# Fine-tuning data export (no extra deps — uses stdlib + existing numpy/pydantic)
finetune = []

# Everything (UI is now the separate engram-ui package)
all = [
    "engram[engines,episodic,semantic,extraction,finetune]",
]

ml = [
    "engram[neural,local-embeddings]",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

ml-dev = [
    "engram[dev,ml]",
]

full-dev = [
    "engram[dev,all,ml]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["engram*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/harness"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Suppress the SkipTest noise from dependency guards
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]
