[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-tutor"
version = "0.1.0"
description = "Reference application and integration test vehicle for the ai_tools LLM libraries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "engram-lite",
  "engram",
  "llm_engines",
  "llm-harness-core>=0.1.0",
]

[project.optional-dependencies]
web = [
  "fastapi",
  "jinja2",
  "python-multipart",
  "uvicorn",
]
voice = [
  "faster-whisper",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["language_tutor*"]

[tool.setuptools.package-data]
language_tutor = ["templates/*.html", "templates/static/css/*.css", "templates/static/js/*.js"]
