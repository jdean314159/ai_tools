# rag_lib default configuration
# Copied to ~/.rag_lib/rag_lib.yaml on first use if no user config exists.
# Edit the user copy — do not edit this file directly.
#
# Resolution order:
#   1. Explicit path passed to RAGPipeline(config=...)
#   2. RAG_LIB_CONFIG env var
#   3. ~/.rag_lib/rag_lib.yaml (auto-created from this file)
#   4. This packaged default

embedder:
  host: http://localhost:11434
  model: nomic-embed-text-v2-moe    # 8192-token context; multilingual; RTX 3090 friendly
  # model_digest: sha256:<digest>    # recommended for frozen/evaluated corpora
  timeout: 120
  batch_size: 32
  keep_alive: 600                   # seconds; keep model warm during ingestion
                                    # prevents 30-90s reload between documents

storage:
  backend: chromadb
  path: ~/.rag_lib/chroma           # persistent; cosine distance enforced on creation
  collection_prefix: rag_
  bm25_path: ~/.rag_lib/bm25        # BM25 index persistence; rebuilt if stale

chunker:
  max_embed_tokens: 1800            # hard ceiling; conservative under nomic's 8192 limit
                                    # ChunkerError raised if text (not context_text) exceeds this
  semantic_max_sentences: 500       # above this, falls back to sentence_window with WARNING
  defaults:
    strategy: fixed_size
    chunk_size: 512
    chunk_overlap: 50
  doc_types:
    # Narrative prose — retrieve at sentence precision, expand to paragraph context
    policy:    {strategy: sentence_window, window_size: 3}
    hr:        {strategy: sentence_window, window_size: 3}
    guide:     {strategy: sentence_window, window_size: 3}
    faq:       {strategy: sentence_window, window_size: 3}
    # Academic papers — survey, methods, results sections; sentence-window retrieves within sections
    paper:     {strategy: sentence_window, window_size: 4}
    # Books and long narrative — slightly wider window for inter-sentence dependencies
    book:      {strategy: sentence_window, window_size: 4}
    # Structured docs with clear heading hierarchy — leaf retrieval, parent context
    spec:      {strategy: hierarchical, chunk_sizes: [2048, 512, 128]}
    runbook:   {strategy: hierarchical, chunk_sizes: [2048, 512, 128]}
    adr:       {strategy: hierarchical, chunk_sizes: [2048, 512, 128]}
    contract:  {strategy: hierarchical, chunk_sizes: [2048, 512, 128]}
    # Unstructured mixed content (Notion exports, scraped HTML, dissertation)
    mixed:     {strategy: semantic, breakpoint_percentile: 92}
    # Thesis: long, chapter-structured; hierarchical handles ADR/chapter/section/paragraph
    thesis:    {strategy: hierarchical, chunk_sizes: [4096, 1024, 256]}

retriever:
  n_candidates: 50                  # Stage 1: hybrid BM25+dense retrieval count
  n_results: 5                      # Soft target after reranking and context budget
  bm25_weight: 0.4                  # RRF weighting: 0.4 BM25 / 0.6 dense
  parent_window: 3                  # Context sentences around retrieved sentence
  max_context_tokens: 3000          # Budget for assemble_prompt(); adjust for your model:
                                    #   llama-server -c 4096 → use ~3000
                                    #   Qwen3:32b 32K → can use 8000-12000
                                    #   Qwen3:8b → use 4000-6000

reranker:
  enabled: false                    # Requires explicit opt-in; downloads from HuggingFace on first use
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: auto                      # auto | cpu | cuda; auto selects CUDA if available

tables:
  complex_threshold: 3              # Header count above which CSV serialization is used
  complex_handler: csv              # csv (default, faithful) | llava (opt-in, hallucination risk)
  llava_model: llava:13b
  llava_keep_alive: 60              # Short; only needed during ingest batches
  row_separator: " | "              # Separates header:value pairs; safe for values with commas

expander:
  enabled: false                    # Adds 1-3s local LLM inference per query
  cache_size: 256                   # LRU cache size for expanded queries

enricher:
  # Contextual chunk enrichment: prepends a document-aware description to each
  # chunk's embed_text before vectorisation. Improves retrieval on multi-section
  # and inferential queries by placing chunks more precisely in vector space.
  # Cost: one LLM call per unique chunk at ingest time (cached on re-ingest via D14).
  enabled: false                    # opt-in; adds LLM call per chunk at ingest

  provider: ollama                  # ollama (local) | anthropic | openai
  model: qwen3:8b                   # local default; ~1-2s per chunk, no API cost
  # Cloud alternatives (higher quality, low cost):
  # provider: anthropic
  # model: claude-haiku-4-5        # ~$0.16 for 161-chunk dissertation
  # api_key_env: ANTHROPIC_API_KEY
  # provider: openai
  # model: gpt-4o-mini
  # api_key_env: OPENAI_API_KEY

  host: http://localhost:11434      # Ollama server (ollama provider only)
  api_key_env: ANTHROPIC_API_KEY   # env var for cloud providers (key never stored)
  timeout: 30
  keep_alive: 60                   # Short; only needed during ingest batch
  max_context_chars: 1000          # Document intro characters passed as context
  batch_size: 1                    # Ollama: 1 (sequential); cloud APIs: 8+
  cache: true                      # Skip re-enrichment if chunk_id unchanged (D14)

loader:
  min_readable_words: 50            # Minimum words after extraction; LoaderError if below
  ocr_word_threshold: 50            # Words/page below this triggers OCR fallback for PDFs
  exclude_patterns:                 # Patterns excluded during ingest_directory()
    - "**/.svn/**"
    - "*.svn-base"
    - "**/text-base/**"
    - "**/prop-base/**"
    - "Thumbs.db"
    - "*.db"
    - ".DS_Store"

eval:
  # judge_llm: required at runtime — no default intentionally
  # Recommended: Claude Haiku (cheap, strong, avoids self-evaluation)
  # Acceptable: qwen3:32b judging qwen3:8b outputs
  # NEVER use the same model for generation and judging
  judge_temperature: 0.0
  n_eval_runs: 3                    # Take median; reduces LLM judge variance
  context_recall_threshold: 0.85   # retrieval quality — model-independent
  context_precision_threshold: 0.80 # retrieval quality — model-independent
  faithfulness_threshold: 0.88     # calibrated for local 8-32B models (not frontier)
  answer_relevancy_threshold: 0.80  # end-to-end quality
