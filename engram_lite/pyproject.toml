[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-lite"
version = "0.2.0"
description = "Production memory system for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "engram",
    "llm-harness-core>=0.1.0",
    "chromadb>=0.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
graph = ["networkx>=3.0"]
tiktoken = ["tiktoken>=0.5.0"]
sentence-transformers = ["sentence-transformers>=2.2.0"]
all = ["networkx>=3.0", "tiktoken>=0.5.0", "sentence-transformers>=2.2.0"]
dev = ["pytest>=8.0", "networkx>=3.0"]

[project.scripts]
engram-lite-migrate = "engram_lite.cli.migrate:main"
engram-lite-reconcile = "engram_lite.cli.reconcile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
