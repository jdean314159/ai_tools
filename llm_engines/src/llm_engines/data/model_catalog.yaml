# llm_engines/data/model_catalog.yaml
#
# Static catalog of known model VRAM requirements.
# Ollama's /api/tags does not expose VRAM requirements, so this file
# is the source of truth for ModelRegistry.get_model_info() and
# ModelRegistry.recommend_model().
#
# Fields:
#   name:               Ollama model tag (or HuggingFace model ID)
#   backend:            ollama | huggingface
#   size_gb:            Approximate on-disk size
#   min_vram_mb:        Minimum to load (may swap heavily below this)
#   recommended_vram_mb: Comfortable inference (no swapping, reasonable speed)
#   quantization:       Quantization format if known
#   capabilities:
#     chat, embeddings, tool_calling, vision: true/false
#   tasks:              List of TaskType values this model suits

# ---------------------------------------------------------------------------
# Qwen 2.5 family (Ollama)
# ---------------------------------------------------------------------------

- name: qwen2.5:3b
  backend: ollama
  size_gb: 2.0
  min_vram_mb: 2500
