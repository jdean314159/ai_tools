# llm_engines/data/llm_engines.yaml
#
# Packaged default engine configuration.
# Copied to ~/.engram/llm_engines.yaml on first use if no user config exists.
# Edit the user copy — do not edit this file directly.
#
# Usage:
#   engine = EngineFactory.from_profile("default_local")
#   engine = EngineFactory.from_engine_name("qwen27b")

engines:

  # --- Ollama: RTX 3090 (24GB) ---

  qwen27b:
    type: ollama
    model: qwen3:27b
    base_url: http://localhost:11434
    max_context: 32768
    num_gpu: null          # null = Ollama default (all GPU layers)
    thinking: false        # disable CoT for Qwen3
    keep_alive: 300
    system_prompt: You are a helpful AI assistant.

  qwen8b:
    type: ollama
    model: qwen3:8b
    base_url: http://localhost:11434
    max_context: 32768
    num_gpu: null
    thinking: false
    keep_alive: 300
    system_prompt: You are a helpful AI assistant.

  # RTX 3090 split-offload: 32B model with 40 layers on GPU, rest on CPU
  # Slower than full-GPU but enables models > 24GB VRAM at Q4_K_M
  qwen32b_split:
    type: ollama
    model: qwen3:32b
    base_url: http://localhost:11434
    max_context: 16384
    num_gpu: 40            # ~14GB on RTX 3090; tune based on actual VRAM usage
    thinking: false
    keep_alive: 0          # unload immediately after use (saves VRAM for other models)
    system_prompt: You are a helpful AI assistant.

  # Embedding model
  nomic_embed:
    type: ollama
    model: nomic-embed-text
    base_url: http://localhost:11434
    max_context: 8192
    keep_alive: 300

  # --- RTX 2070 (8GB) secondary machine ---
  qwen8b_secondary:
    type: ollama
    model: qwen3:8b
    base_url: http://secondary-machine:11434    # set OLLAMA_BASE_URL on that host
    max_context: 16384
    num_gpu: null
    thinking: false
    keep_alive: 300

  # --- Laptop: GTX 1650 (4GB) ---
  qwen3b_laptop:
    type: ollama
    model: qwen2.5:3b
    base_url: http://localhost:11434
    max_context: 8192
    num_gpu: null
    thinking: false
    keep_alive: 300

  # --- DGX Spark ---
  spark_qwen:
    type: openai
    model: Qwen3.8-Flash-Next-UD-IQ4_XS
    # Replace in ~/.engram/llm_engines.yaml or a config selected with
    # LLM_ENGINES_CONFIG; never commit a private deployment address here.
    base_url: http://inference-host:8080/v1
    api_key: dummy
    is_cloud: false

  # --- Cloud fallbacks (require API keys in environment) ---

  claude:
    type: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    max_context: 200000
    system_prompt: You are a helpful AI assistant.

  openai_mini:
    type: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    max_context: 128000
    system_prompt: You are a helpful AI assistant.

  # --- llama.cpp: split offload without Ollama ---
  # Used when Ollama is unavailable or for GGUF models not in Ollama registry.
  llama_32b_split:
    type: llamacpp
    model: qwen2.5-32b-split
    gguf_path: /models/qwen2.5-32b-instruct-q4_k_m.gguf
    base_url: http://127.0.0.1:8081/v1
    max_context: 16384
    n_gpu_layers: 40

  # --- Mock (testing only) ---
  mock:
    type: mock
    model: mock-1b

profiles:

  # Primary: RTX 3090, local only, no cloud
  default_local:
    engines: [qwen27b, qwen8b]
    allow_cloud_failover: false
    max_attempts: 4
    circuit_breaker_failures: 3
    circuit_breaker_cooldown_s: 30

  # With optional cloud fallback
  local_plus_cloud:
    engines: [qwen27b, qwen8b, claude]
    allow_cloud_failover: true
    cloud_policy: query_plus_summary
    max_attempts: 4
    circuit_breaker_failures: 3
    circuit_breaker_cooldown_s: 30

  # Laptop / low-VRAM
  laptop:
    engines: [qwen3b_laptop]
    allow_cloud_failover: false
    max_attempts: 2
    circuit_breaker_failures: 2
    circuit_breaker_cooldown_s: 15

  # Spanish/Latin tutor: planner + executor pattern
  # Note: create these separately; OLLAMA_KEEP_ALIVE=0 between calls
  tutor_planner:
    engines: [qwen27b]
    allow_cloud_failover: false
    max_attempts: 2
    circuit_breaker_failures: 2
    circuit_breaker_cooldown_s: 15

  tutor_executor:
    engines: [qwen8b]
    allow_cloud_failover: false
    max_attempts: 2
    circuit_breaker_failures: 2
    circuit_breaker_cooldown_s: 15

  # Testing
  test:
    engines: [mock]
    allow_cloud_failover: false
    max_attempts: 1
    circuit_breaker_failures: 10
    circuit_breaker_cooldown_s: 0
