[pytest]
addopts = --import-mode=importlib
pythonpath =
    llm_harness_core/src
    llm_engines
    engram/src
    engram_lite/src
    llm_inspector/src
    rag_lib/src
    llm_inspector_ui/src
    language_tutor/src
    agent_lib/src
markers =
    engram: tests requiring engram/chromadb/local memory stack
    integration: cross-package integration tests
    rag: tests requiring rag_lib integration
    openai: tests requiring OpenAI API credentials
    vllm: tests requiring a running vLLM server
    ollama: tests requiring a running Ollama server
    slow: slow or optional optimization tests
