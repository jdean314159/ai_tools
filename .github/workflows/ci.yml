name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  static-and-build:
    name: Static checks and wheel builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Install lint tooling
        run: |
          python -m pip install mypy
          python -m pip install -e ./llm_harness_core
          python -m pip install -e ./llm_engines[dev]
      - name: Compile all tracked Python packages
        run: |
          python -m compileall -q agent_lib engram examples/diagnostics_agent examples/language_tutor examples/mail_assistant mail_lib tests/integration_tests llm_engines llm_harness_core llm_inspector llm_inspector_ui rag_lib
      - name: Lint (mypy)
        run: |
          python -m mypy llm_engines/src/llm_engines/ \
            --config-file llm_engines/pyproject.toml \
            --ignore-missing-imports --no-error-summary
      - name: Build wheels for all packages
        # examples/ applications are integration vehicles, not published packages.
        # Wheel builds for examples are intentionally omitted.
        run: |
          for pkg in llm_harness_core llm_engines engram rag_lib mail_lib llm_inspector llm_inspector_ui agent_lib; do
            (cd "$pkg" && python -m build --wheel)
          done

  core:
    name: Core libraries (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./engram[dev]
          python -m pip install -e ./llm_inspector[dev]
          python -m pip install -e ./rag_lib[dev]
          python -m pip install -e ./mail_lib[dev]
          python -m pip install -e ./llm_inspector_ui[dev]
          python -m pip install -e ./agent_lib[dev]
          python -m pip install -e ./examples/diagnostics_agent[dev]
      - name: Run core tests
        run: |
          cd llm_harness_core && python -m pytest -q tests
          cd ../llm_engines && python -m pytest -q tests
          cd ../engram && python -m pytest -q tests
          cd ../llm_inspector && python -m pytest -q tests
          cd ../agent_lib && python -m pytest -q tests
          cd ../rag_lib && python -m pytest -q tests
          cd ../examples/diagnostics_agent && python -m pytest -q tests
          cd ../.. && python -m pytest -q tests/test_public_api.py

  integration:
    name: Cross-package integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./engram
          python -m pip install -e ./llm_inspector[dev]
          python -m pip install -e ./rag_lib[dev]
          python -m pip install -e ./mail_lib[dev]
          python -m pip install -e ./llm_inspector_ui[dev]
      - name: Run integration tests
        run: python -m pytest -q tests/integration_tests

  agent:
    name: Agent kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./engram[dev]
          python -m pip install -e ./llm_inspector[dev]
          python -m pip install -e ./rag_lib[dev]
          python -m pip install -e ./agent_lib[dev]
      - name: Run agent tests
        run: cd agent_lib && python -m pytest -q tests

  tutor:
    name: Tutor integration vehicle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./engram
          python -m pip install -e './examples/language_tutor[dev]'
      - name: Run tutor tests
        run: cd examples/language_tutor && python -m pytest -q test_language_tutor.py

  teaching:
    name: Teaching artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Publication hygiene check
        run: python scripts/check_publication_hygiene.py
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./llm_inspector[dev]
          python -m pip install -e ./rag_lib[dev]
          python -m pip install -e ./engram[dev]
          python -m pip install -e ./agent_lib[dev]
          python -m pip install -e './examples/language_tutor[dev]'
      - name: Validate teaching artifacts
        run: python scripts/check_teaching_artifacts.py
      - name: Ghost-reference check
        run: python scripts/check_ghost_references.py
      - name: Markdown link check
        run: python scripts/check_markdown_links.py
      - name: Decision-history metadata check
        run: python scripts/validate_decision_history.py
      - name: Dependency-direction check
        run: python scripts/check_dependency_direction.py
      - name: Tier-label check
        run: python scripts/check_tier_labels.py

  ui:
    name: Inspector UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./engram[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e ./llm_inspector[dev]
          python -m pip install -e ./rag_lib[dev]
          python -m pip install -e ./llm_inspector_ui[dev]
      - name: Run UI tests
        run: cd llm_inspector_ui && python -m pytest -q tests

  mail:
    name: Mail application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install editable packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./llm_harness_core[dev]
          python -m pip install -e ./llm_engines[dev]
          python -m pip install -e './mail_lib[dev]'
          python -m pip install -e './examples/mail_assistant[dev]'
      - name: Run mail tests
        run: |
          python -m pytest -q tests/test_mail_lib.py \
            examples/mail_assistant/test_mail_assistant.py \
            examples/mail_assistant/test_imap_trash.py \
            tests/test_public_api.py
