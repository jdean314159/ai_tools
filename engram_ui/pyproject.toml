[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-ui"
version = "0.1.0"
description = "Streamlit sandbox reference app for Engram"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeffrey Dean"}]
readme = "README.md"

dependencies = [
    "engram>=0.1.19",
    "streamlit>=1.30.0",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["engram_ui*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
